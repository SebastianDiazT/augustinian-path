<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 430 110' width='100%' height='100%' preserveAspectRatio='xMidYMid meet' role='img' aria-labelledby='logo-title logo-description' shape-rendering='geometricPrecision'>
  <title id='logo-title'>Ruta Agustina — versión light</title>
  <desc id='logo-description'>Versión monocromática blanca para fondos oscuros.</desc>
  <style>
    .route { fill: none; stroke: #FFFFFF; stroke-width: 10; }
    .node { fill: none; stroke: #FFFFFF; stroke-width: 6; }
    .node-accent { fill: none; stroke: #FFFFFF; stroke-width: 6; }
    .separator { stroke: #FFFFFF; stroke-width: 3; }
    .wordmark { fill: #FFFFFF; font-family: Inter, Manrope, Montserrat, Arial, sans-serif; font-weight: 800; letter-spacing: -1px; }
    .primary { font-size: 34px; }
    .secondary { font-size: 31px; }
  </style>
  <g id='isotype' transform='translate(5 5)'>
    <path class='route' d='M 28 18 H 55 C 70 18, 78 26, 78 38 C 78 50, 70 58, 56 58 H 55'/>
    <path class='route' d='M 36 58 C 28 58, 22 64, 22 74 V 95'/>
    <path class='route' d='M 50 65 L 70 82'/>
    <circle class='node' cx='20' cy='18' r='8'/>
    <circle class='node' cx='77' cy='88' r='8'/>
    <circle class='node-accent' cx='45' cy='58' r='8'/>
</g>
  <line class='separator' x1='122' y1='22' x2='122' y2='88'/>
  <g id='wordmark'>
    <text class='wordmark primary' x='145' y='48'>Ruta</text>
    <text class='wordmark secondary' x='145' y='83'>Agustina</text>
  </g>
</svg>
