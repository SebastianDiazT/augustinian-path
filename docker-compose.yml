services:
  db:
    image: postgres:16-alpine
    container_name: ruta_agustina_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ruta_agustina}
      POSTGRES_USER: ${DB_USER:-ruta_agustina}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ruta_agustina}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ruta_agustina}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ruta_agustina_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ruta_agustina_frontend
    command: pnpm dev --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

volumes:
  postgres_data:
