services:
  - type: keyvalue
    name: augustinian-path-cache
    plan: free
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: 'off'

  - type: web
    name: augustinian-path-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/health/

    buildCommand: >-
      uv sync --frozen --no-dev &&
      uv run --frozen --no-dev
      python manage.py collectstatic --noinput

    startCommand: >-
      uv run --frozen --no-dev
      python manage.py migrate --noinput &&
      uv run --frozen --no-dev
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --timeout 120
      --access-logfile -
      --error-logfile -

    envVars:
      - key: UV_VERSION
        value: '0.12.1'

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: 'False'

      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: augustinian-path-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME

      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false

      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: augustinian-path-cache
          property: connectionString

      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false

      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

      - key: DJANGO_SECURE_HSTS_SECONDS
        value: '3600'

      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: 'False'

      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: 'False'

      - key: DJANGO_TRUST_PROXY_SSL_HEADER
        value: 'True'