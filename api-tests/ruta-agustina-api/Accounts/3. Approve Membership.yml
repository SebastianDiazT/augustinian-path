info:
  name: 3. Approve Membership
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/accounts/membership-requests/{{request_id}}/approve/"
  body:
    type: json
    data: |-
      {
        "resolution_comment": "Aprobado automáticamente para pruebas de sistema."
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Membership is granted", function() {
          const response = res.getBody();
          expect(response.data.status).to.equal("approved");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5