info:
  name: 3. Update School
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{base_url}}/institution/professional-schools/{{school_id}}/"
  body:
    type: json
    data: |-
      {
        "name": "Escuela Profesional de Ingeniería de Sistemas (EPIS)"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Name is successfully updated", function() {
          const response = res.getBody();
          expect(response.data.name).to.equal("Escuela Profesional de Ingeniería de Sistemas (EPIS)");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5