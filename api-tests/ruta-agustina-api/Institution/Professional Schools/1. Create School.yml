info:
  name: 1. Create School
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/institution/professional-schools/"
  body:
    type: json
    data: |-
      {
        "faculty": "{{faculty_id}}",
        "name": "Escuela Profesional de Ingeniería de Sistemas",
        "code": "EPIS",
        "is_active": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        if (res.getStatus() === 201 && response.data.public_id) {
            bru.setEnvVar("school_id", response.data.public_id);
        }
    - type: tests
      code: |-
        test("Status code is 201 Created", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("School is linked to Faculty correctly", function() {
          const response = res.getBody();
          expect(response.data.faculty).to.equal(bru.getEnvVar("faculty_id"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5