info:
  name: 1. Create Area
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/institution/areas/"
  body:
    type: json
    data: |-
      {
        "name": "Área de Ingenierías",
        "code": "ingenierias",
        "is_active": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        if (res.getStatus() === 201 && response.data.public_id) {
            bru.setEnvVar("area_id", response.data.public_id);
        }
    - type: tests
      code: |-
        test("Status code is 201 Created", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("Response follows the envelope standard", function() {
          const response = res.getBody();
          expect(response).to.have.property('data');
          expect(response).to.have.property('meta');
        });

        test("Area ID is generated", function() {
          const response = res.getBody();
          expect(response.data).to.have.property('public_id');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5