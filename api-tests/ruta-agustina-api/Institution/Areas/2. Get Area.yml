info:
  name: 2. Get Area
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/institution/areas/{{area_id}}/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Data matches the created Area", function() {
          const response = res.getBody();
          expect(response.data.public_id).to.equal(bru.getEnvVar("area_id"));
          expect(response.data.code).to.equal("ingenierias");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5