info:
  name: 1. Create Faculty
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/institution/faculties/"
  body:
    type: json
    data: |-
      {
        "area": "{{area_id}}",
        "name": "Facultad de Ingeniería de Producción y Servicios",
        "code": "FIPS",
        "is_active": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        if (res.getStatus() === 201 && response.data.public_id) {
            bru.setEnvVar("faculty_id", response.data.public_id);
        }
    - type: tests
      code: |-
        test("Status code is 201 Created", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("Faculty is linked to Area correctly", function() {
          const response = res.getBody();
          expect(response.data.area).to.equal(bru.getEnvVar("area_id"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5