info:
  name: 2. Get Faculty
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/institution/faculties/{{faculty_id}}/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Data matches the created Faculty", function() {
          const response = res.getBody();
          expect(response.data.public_id).to.equal(bru.getEnvVar("faculty_id"));
          expect(response.data.area).to.equal(bru.getEnvVar("area_id"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5