info:
  name: Create Faculty
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/institution/faculties/"
  body:
    type: json
    data: |-
      {
        "area": "{{area_id}}",
        "name": "Facultad de Ingeniería de Producción y Servicios",
        "code": "fips",
        "is_active": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        bru.setGlobalEnvVar("faculty_id", response.data.public_id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
