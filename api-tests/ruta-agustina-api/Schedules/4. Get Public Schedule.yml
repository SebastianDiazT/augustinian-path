info:
  name: 4. Get Public Schedule
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/schedules/public/{{share_link_id}}/"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Student name is visible due to preferences", function() {
          const response = res.getBody();
          expect(response.data).to.have.property('student_name');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5