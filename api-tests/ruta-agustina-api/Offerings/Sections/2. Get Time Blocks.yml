info:
  name: 2. Get Time Blocks
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/offerings/time-blocks/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        
        test("Extract one time block ID to environment", function() {
          const response = res.getBody();
          if (response.data && response.data.length > 0) {
              // Guardamos el ID del primer bloque (usualmente 7:00 AM - 7:50 AM)
              bru.setEnvVar("time_block_id", response.data[0].public_id);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5