info:
  name: 3. Set Meetings
  type: http
  seq: 3

http:
  method: PUT
  url: "{{base_url}}/offerings/sections/{{section_id}}/meetings/"
  body:
    type: json
    data: |-
      [
        {
          "day_of_week": "monday",
          "time_block": "{{time_block_id}}",
          "room": "Pabellón A - 101"
        },
        {
          "day_of_week": "wednesday",
          "time_block": "{{time_block_id}}",
          "room": "Pabellón A - 101"
        }
      ]
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          // Nota: Si el curso exige más horas de las que mandamos, podría dar 400.
          // El test validará qué responde.
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5