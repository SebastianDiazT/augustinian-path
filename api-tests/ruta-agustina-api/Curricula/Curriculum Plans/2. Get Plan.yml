info:
  name: 2. Get Plan
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/curricula/curriculum-plans/{{plan_id}}/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Data matches the created Plan", function() {
          const response = res.getBody();
          expect(response.data.public_id).to.equal(bru.getEnvVar("plan_id"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5