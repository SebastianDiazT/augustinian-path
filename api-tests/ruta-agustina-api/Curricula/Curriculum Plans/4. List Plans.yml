info:
  name: 4. List Plans
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/curricula/curriculum-plans/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Data is an array and Meta has pagination", function() {
          const response = res.getBody();
          expect(response.data).to.be.an('array');
          expect(response.meta.pagination).to.have.property('total_items');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5