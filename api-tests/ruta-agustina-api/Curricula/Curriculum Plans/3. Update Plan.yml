info:
  name: 3. Update Plan
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{base_url}}/curricula/curriculum-plans/{{plan_id}}/"
  body:
    type: json
    data: |-
      {
        "name": "Plan de Estudios 2026 (Actualizado)"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Name is successfully updated", function() {
          const response = res.getBody();
          expect(response.data.name).to.equal("Plan de Estudios 2026 (Actualizado)");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5