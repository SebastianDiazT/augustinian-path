info:
  name: 1. Create Instructor
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/curricula/instructors/"
  body:
    type: json
    data: |-
      {
        "full_name": "Prof. García"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        if (res.getStatus() === 201 && response.data.public_id) {
            bru.setEnvVar("instructor_id", response.data.public_id);
        }
    - type: tests
      code: |-
        test("Status code is 201 Created", function() {
          expect(res.getStatus()).to.equal(201);
        });
        test("Instructor name is saved", function() {
          const response = res.getBody();
          expect(response.data.full_name).to.equal("Prof. García");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5