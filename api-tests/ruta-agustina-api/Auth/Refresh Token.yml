info:
  name: Refresh Token
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/accounts/auth/refresh/"
  body:
    type: json
    data: |-
      {
        "refresh": "{{refresh_token}}"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        if (res.getStatus() === 200 && response.data.access) {
            bru.setEnvVar("access_token", response.data.access);
            bru.setEnvVar("refresh_token", response.data.refresh);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
