info:
  name: Google Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/accounts/auth/google/"
  body:
    type: json
    data: |-
      {
        "id_token": "{{id_token}}"
      }
  auth: inherit

