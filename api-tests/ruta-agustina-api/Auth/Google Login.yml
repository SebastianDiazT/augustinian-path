  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        if (res.getStatus() === 200 && response.data.access) {
            bru.setEnvVar("access_token", response.data.access);
            bru.setEnvVar("refresh_token", response.data.refresh);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
