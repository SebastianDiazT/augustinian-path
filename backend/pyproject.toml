[project]
name = "ruta-agustina-backend"
version = "0.1.0"
description = "API REST del backend de Ruta Agustina — plataforma de planificación académica para estudiantes de la UNSA"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "django-cors-headers>=4.4",
    "django-filter>=24.3",
    "drf-spectacular>=0.27",
    "djangorestframework-simplejwt>=5.3",
    "argon2-cffi>=23.1",
    "google-auth>=2.34",
    "requests>=2.34.2",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "django-csp>=3.8",
]

# NOTA: Supabase Storage es compatible con la API de S3. Cuando se implemente
# el manejo de archivos (fuera de alcance de esta tarea), la dependencia a
# agregar aquí es "django-storages[s3]>=1.14", configurando DEFAULT_FILE_STORAGE
# / STORAGES en settings apuntando al endpoint S3 de Supabase. No se agrega
# todavía porque no hay ningún caso de uso real que la requiera.

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.9",
    "pytest-factoryboy>=2.8.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.6",
]

[tool.uv]
# Esto es una aplicación (un proyecto Django), no una librería distribuible:
# uv no necesita construir un wheel de este paquete.
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"  # py314 aún no está entre los targets soportados por ruff; se actualizará cuando lo esté
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]
ignore = [
    "DJ001",  # permite null=True en CharField/TextField cuando el modelo lo justifique
]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.ruff.format]
quote-style = "single"
indent-style = 'space'
line-ending = 'auto'

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["apps"]
addopts = "--reuse-db --nomigrations"

[tool.coverage.run]
omit = [
    "*/migrations/*",
]
